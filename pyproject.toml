[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-testbench"
version = "0.10.0"
description = "Framework comparison and benchmarking of error concealment algorithms"
readme = "README.md"
authors = [
    {name = "Luca Vignati", email = "luca.vignati@vignati.net"},
    {name = "Filippo Daniotti", email = "fpp.daniotti@gmail.com"}
]
license = {text = "Your license here"} 
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3"
]

dependencies = [
    "numpy==1.26.0",
    "soundfile==0.12.1",
    "anytree==2.12.1",
    "pymongo==4.10.1",
    "tqdm==4.67.1",
    "matplotlib==3.9.3",
    "tensorflow",
    "cpp-plc-template",
    "burg-plc",
    "typing_inspect",
    "pybind11==2.13.6",
    "tinydb==4.8.2",
    "ruamel.yaml==0.18.6",
    "ruamel.yaml.clib==0.2.12",
    "librosa==0.10.1",
    "essentia==2.1b6.dev1110",
    "Brian2==2.7.1",
    "brian2hears==0.9.2",
    "plotly==5.24.1",
    "scipy==1.14.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["plctestbench*"]
