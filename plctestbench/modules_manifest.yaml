CrossfadeSettings:
  - name: NoCrossfadeSettings
    settings:

  - name: ManualCrossfadeSettings
    settings:
      - name: length
        type: int
        default: 10
        value: 0
        values: null
      - name: function
        type: Enum
        default: power
        value: power
        values:
          - power
          - sinusoidal
          - hann
      - name: exponent
        type: float
        default: 1.0
        value: 1.0
        values: null
      - name: type
        type: Enum
        default: power
        value: power
        values:
          - power
          - amplitude

  - name: LinearCrossfadeSettings
    settings:
      - name: length
        type: int
        default: 10
        value: 0
        values: null
      - name: type
        type: Enum
        default: power
        value: power
        values:
          - power
          - amplitude

  - name: QuadraticCrossfadeSettings
    settings:
      - name: length
        type: int
        default: 10
        value: 0
        values: null
      - name: type
        type: Enum
        default: power
        value: power
        values:
          - power
          - amplitude

  - name: CubicCrossfadeSettings
    settings:
      - name: length
        type: int
        default: 10
